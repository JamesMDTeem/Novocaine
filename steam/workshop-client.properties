description=[h2]Novocaine[/h2]\nA custom Haven & Hearth client: a live pull of Nightdawg's Hurricane with our own features layered on top.\n\n[h3]Display:[/h3]\n[list]\n[*]Borderless fullscreen - alt-tab without the mode switch\n[/list]\n\n[h3]Custom features:[/h3]\n[list]\n[*]Alchemy Book mirror (passive discovery upload)\n[*]Nurgling Imports: LP-discovery markers (world + minimap), harvest overlays, never-crafted craft highlight, and an Auto-LP bot\n[*]Bot Places: name regions of the map and tag what they are for, so bots are told where water, food and work are rather than coordinates\n[/list]\n\n[h3]Work in progress:[/h3]\nThe crew bots (cleanup, cellar digging, water scouting) and their long-range pathing are still being worked on and will misbehave. Everything above them is stable.\n\n[h3]Credits:[/h3]\nBuilt on [url=https://github.com/Nightdawg/Hurricane]Nightdawg's Hurricane[/url] (and Loftar's Vanilla client under that). LP features ported from the nurgling2 client.
