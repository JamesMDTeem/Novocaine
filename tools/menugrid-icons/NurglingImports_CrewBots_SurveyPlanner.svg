<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <g stroke-linejoin="round" stroke-linecap="round">

    <!-- Ground before levelling: high on the left, low on the right. Two flat steps rather than a
         slope, because a slope reads as a smear at 32px and steps keep their shape. -->
    <path d="M6 46 H58 V84 H122 V118 H6 Z" fill="#7a5230" stroke="#1b120a" stroke-width="6"/>

    <!-- The cut: what stands above the target and has to come off. -->
    <path d="M6 46 H58 V70 H6 Z" fill="#ff9d2e" stroke="#1b120a" stroke-width="5.5"/>

    <!-- The fill: what sits below it and has to be made up. -->
    <path d="M58 70 H122 V84 H58 Z" fill="#3f86c4" stroke="#1b120a" stroke-width="5.5"/>

    <!-- The one level every survey is set to, straight across both. -->
    <path d="M2 70 H126" fill="none" stroke="#1b120a" stroke-width="11"/>
    <path d="M2 70 H126" fill="none" stroke="#ffe14d" stroke-width="6"/>

    <!-- The survey boundary the plan chooses. -->
    <path d="M58 30 V118" fill="none" stroke="#1b120a" stroke-width="9"/>
    <path d="M58 30 V118" fill="none" stroke="#e8dcc8" stroke-width="4"/>

    <g stroke="#1b120a" stroke-width="3.5">
      <circle cx="92" cy="116" r="6.5" fill="#ff9d2e"/>
      <circle cx="106" cy="116" r="6.5" fill="#ff9d2e"/>
      <circle cx="120" cy="116" r="6.5" fill="#ff9d2e"/>
    </g>
  </g>
</svg>
